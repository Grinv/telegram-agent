schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  Tech stack: TypeScript on Node.js (current LTS, e.g. 24.x), native ESM
  ("type": "module"), tsx for dev execution, tsc for the build.

  Avoid third-party SDKs/libraries where a Node built-in covers it, to limit
  supply-chain surface: fetch for HTTP (Telegram Bot API, Ollama), util.styleText
  for colored console output, process.loadEnvFile() instead of dotenv.

  LLM inference is pluggable: every provider implements one BaseConnector
  contract (callLlm(prompt): Promise<LlmResult>), lives under src/llms/<provider>/,
  and is selected at runtime via the LLM_PROVIDER env var (default: stub).
  Each callLlm invocation runs isolated in a forked child process with a
  timeout that kills the child on hang/crash - never call a connector in-process
  without that isolation.

  Testing: node:test + node:assert only, no external test framework. Prefer
  fakes/fixtures (fake fetch, fixture runner scripts) over hitting real
  network services or real child-process connectors in tests.

  The bot is intentionally memoryless/one-shot (User Message -> LLM -> Reply);
  do not introduce per-chat conversation history without an explicit decision
  to change that.

  Planning artifacts must be self-contained. A change is read and implemented
  by someone - or some agent - who did not see the conversation that produced
  it. Never rely on chat history, prior messages, or "as discussed" to carry
  meaning: if a fact, decision, or constraint matters to the change, write it
  into the artifact. Refer to other artifacts of the same change and to files
  in the repo by path; never refer to a conversation.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  proposal:
    - State the problem concretely enough that a reader who was not part of
      the discussion can verify it independently - name the file, symbol, or
      observed behavior at issue rather than describing it in the abstract.
    - Record what was decided and why, including options that were rejected,
      when the decision is not obvious from the problem statement.
  specs:
    - A spec must be readable on its own, without the proposal or design.
      Do not write requirements whose meaning depends on knowing why the
      change was made.
    - Name the observable behavior, not the code that implements it. A reader
      should be able to write a test from the scenario alone.
  design:
    - Record the rationale for each decision in the document itself, including
      the alternatives considered and why they lost. A decision whose reasoning
      lives only in a conversation is not documented.
  tasks:
    - Each task must name the file or module it touches and how to verify it,
      so it can be executed without reconstructing the discussion.
    - Every scenario in the change's specs must be covered by at least one
      task that adds or updates an automated test. Tests are tasks in their
      own right, not a trailing "add tests" catch-all.
    - Finish with a task that runs the full suite and the type check, so a
      change is never considered done on the strength of new tests alone.

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
operations:
  apply:
    guidance:
      - Apply KISS, DRY, and YAGNI - keep implementations simple, avoid
        duplication, and don't build for hypothetical future requirements.
      - Prefer pure functions (no hidden state/side effects) wherever practical,
        so logic is easy to unit test in isolation.
      - Strive for independent, loosely coupled modules with clear boundaries.
        Each module should be testable in isolation - no cross-module imports
        for core logic, dependencies injected rather than hardcoded.
      - Cover new logic with tests as you implement it, not as an afterthought.
      - >-
        Prefer delegating tasks to subagents rather than doing the work
        inline, to keep the main context small. Pass each subagent only the
        context it needs for its task (relevant file paths, the task
        description, acceptance criteria) - not the full proposal/design/
        conversation history. Pick the subagent's model to match task
        complexity: a stronger model for tasks requiring design judgment or
        tricky logic, a cheaper/faster model for mechanical or simple tasks.
