services:
  bot:
    build: .
    image: telegram-agent-bot
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - ./skills:/app/skills:ro
    depends_on:
      - ollama
    networks:
      - bot-net
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - bot-net
    restart: unless-stopped

  # Optional local OTLP destination for OTEL_EXPORTER_OTLP_ENDPOINT (see
  # .env.example, README.md's Statistics section). Not started by
  # `docker compose up` (gated behind the "otel-collector" profile) - start
  # explicitly with `docker compose --profile otel-collector up`, then set
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318 in .env. The
  # default config (otel-collector-config.yaml) just logs received traces to
  # its own console; point it at a real backend by editing that file.
  otel-collector:
    image: otel/opentelemetry-collector:latest
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    profiles:
      - otel-collector
    networks:
      - bot-net

  # Not started by `docker compose up` (gated behind the "benchmark"
  # profile) - run explicitly with `docker compose run --rm benchmark ...`.
  # See README.md's Benchmark section.
  benchmark:
    build:
      context: .
      dockerfile: benchmark/Dockerfile
    image: telegram-agent-benchmark
    profiles:
      - benchmark
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
    depends_on:
      - ollama
    networks:
      - bot-net

networks:
  bot-net:

volumes:
  ollama-data:
