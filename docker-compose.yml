services:
  bot:
    build: .
    image: telegram-agent-bot
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - ./skills:/app/skills:ro
    depends_on:
      - ollama
    networks:
      - bot-net
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - bot-net
    restart: unless-stopped

networks:
  bot-net:

volumes:
  ollama-data:
